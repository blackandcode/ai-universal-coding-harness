name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require committed dependency lock
        run: test -f package-lock.json || (echo 'package-lock.json must be committed before release' && exit 1)
      - run: npm ci
      - run: npm run verify
      - run: npm pack
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.tgz'
