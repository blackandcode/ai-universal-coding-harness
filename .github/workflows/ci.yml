name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.18.0
          - os: windows-latest
            node: 24.18.0
          - os: macos-latest
            node: 24.18.0
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/install-ci.mjs
      - run: npm run verify
      - run: npm pack --dry-run
